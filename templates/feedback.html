{% extends "base.html" %}{% block content %}<div class="form-card"><h2>आपल्या परिसरातील समस्या सांगा</h2><div class="note">फक्त सार्वजनिक सुविधा व विकासाशी संबंधित समस्या/सूचना नोंदवा.</div>{% if error %}<div class="alert">{{error}}</div>{% endif %}<form method="post" enctype="multipart/form-data"><label>आपला वॉर्ड *</label><select name="ward" required><option value="">निवडा</option>{% for w in wards %}<option>{{w}}</option>{% endfor %}</select><label>समस्येचा प्रकार *</label><select name="category" required><option value="">निवडा</option>{% for c in categories %}<option>{{c}}</option>{% endfor %}</select><label>समस्या कुठे आहे? *</label><input name="location" required placeholder="उदा. मुख्य रस्ता, शाळेजवळ"><label>समस्या काय आहे? *</label><textarea name="description" required></textarea><label>महत्त्व *</label><select name="priority" required>{% for p in priorities %}<option>{{p}}</option>{% endfor %}</select><label>किती दिवसांपासून?</label><select name="duration"><option>काही दिवस</option><option>काही आठवडे</option><option>काही महिने</option><option>1 वर्षापेक्षा जास्त</option><option>माहिती नाही</option></select><label>समस्येचा फोटो (पर्यायी, 5MB पर्यंत)</label><input type="file" name="photo" accept="image/jpeg,image/png,image/webp"><label>नाव (पर्यायी)</label><input name="name"><label>मोबाईल नंबर (पर्यायी)</label><input name="phone" inputmode="numeric"><button class="btn" type="submit">अभिप्राय पाठवा</button></form></div>{% endblock %}
